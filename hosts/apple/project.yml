name: Goat
options:
  bundleIdPrefix: com.thejefflarson
  # Local.xcconfig is gitignored; a fresh checkout gets the empty example (unsigned).
  # `test -e || cp` (not `cp -n`): macOS `cp -n` exits 1 when it skips an existing
  # file, which would fail preGenCommand and abort xcodegen for anyone who already
  # has a Local.xcconfig.
  preGenCommand: "test -e 'Local.xcconfig' || cp 'Local.xcconfig.example' 'Local.xcconfig'"
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
configFiles:
  Debug: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
# Both apps share App/ and the GoatKit sources, built here as a framework per
# platform (the GoatKit package is the same code for `swift test`).
# Resources/web is staged by scripts/stage-web.sh: web/embed.html, its modules
# and goat_web.wasm.
schemes:
  GoatKitTests-macOS:
    build:
      targets:
        GoatTestHost-macOS: all
        GoatKit-macOS: all
    test:
      targets: [GoatKitTests-macOS]
targets:
  GoatKit-macOS:
    type: framework
    platform: macOS
    sources: [GoatKit/Sources/GoatKit]
    settings:
      base: &framework
        PRODUCT_NAME: GoatKit
        PRODUCT_BUNDLE_IDENTIFIER: com.thejefflarson.goat.kit
        GENERATE_INFOPLIST_FILE: YES
  GoatKit-iOS:
    type: framework
    platform: iOS
    sources: [GoatKit/Sources/GoatKit]
    settings:
      base: *framework
  Goat-macOS:
    type: application
    platform: macOS
    sources:
      - App
      - path: Resources/web
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - target: GoatKit-macOS
    preBuildScripts:
      - name: Check staged web assets
        script: '"$SRCROOT/scripts/check-staged.sh"'
        basedOnDependencyAnalysis: false
        # Declared so the phase reads its script and the files it stats under
        # ENABLE_USER_SCRIPT_SANDBOXING (Xcode's recommended default).
        inputFiles:
          - $(SRCROOT)/scripts/check-staged.sh
          - $(SRCROOT)/Resources/web/embed.html
          - $(SRCROOT)/Resources/web/goat_web.wasm
    entitlements:
      path: Goat-macOS.entitlements
      properties: &sandbox
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.cs.allow-jit: true
        # WebKit's web content and networking processes crash without it, even
        # though the page loads only the bundled goat-app:// scheme.
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thejefflarson.goat
        PRODUCT_NAME: Goat
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Info-macOS.plist
      properties: &info
        CFBundleDisplayName: Goat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeName: Goat source
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.thejefflarson.goat.source]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.thejefflarson.goat.source
            UTTypeDescription: Goat source
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [goat]
              public.mime-type: [text/x-goat]
  # A windowless app that runs the web view tests inside the same sandbox and
  # signing settings as Goat-macOS, without ever showing the editor.
  GoatTestHost-macOS:
    type: application
    platform: macOS
    sources:
      - TestHost
      - path: Resources/web
        type: folder
        buildPhase: resources
        optional: true
    preBuildScripts:
      - name: Check staged web assets
        script: '"$SRCROOT/scripts/check-staged.sh"'
        basedOnDependencyAnalysis: false
    entitlements:
      path: GoatTestHost-macOS.entitlements
      properties: *sandbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thejefflarson.goat.testhost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_HARDENED_RUNTIME: YES
  GoatKitTests-macOS:
    type: bundle.unit-test
    platform: macOS
    sources: [GoatKit/Tests/GoatKitTests]
    dependencies:
      - target: GoatTestHost-macOS
      - target: GoatKit-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thejefflarson.goat.kit.tests
        GENERATE_INFOPLIST_FILE: YES
  Goat-iOS:
    type: application
    platform: iOS
    sources:
      - App
      - path: Resources/web
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - target: GoatKit-iOS
    preBuildScripts:
      - name: Check staged web assets
        script: '"$SRCROOT/scripts/check-staged.sh"'
        basedOnDependencyAnalysis: false
        # Declared so the phase reads its script and the files it stats under
        # ENABLE_USER_SCRIPT_SANDBOXING (Xcode's recommended default).
        inputFiles:
          - $(SRCROOT)/scripts/check-staged.sh
          - $(SRCROOT)/Resources/web/embed.html
          - $(SRCROOT)/Resources/web/goat_web.wasm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thejefflarson.goat
        PRODUCT_NAME: Goat
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info-iOS.plist
      properties:
        <<: *info
        UILaunchScreen: {}
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
