name: CI

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:

# Cancel superseded runs for the same ref so a fast push doesn't pile up jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: goat-runners
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The image installs Rust under ~/.cargo/bin but does not add it to the
      # job shell's PATH the way GitHub-hosted runners do, so rustup/cargo/sccache
      # are not found until this runs. Must precede Start sccache (sccache lives
      # there too).
      - name: Enable rust
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start sccache
        run: bash .github/scripts/start-sccache.sh

      # The runner ships a stable Rust toolchain; just add the components we
      # lint with.
      - name: Add clippy and rustfmt
        run: rustup component add clippy rustfmt

      - name: Format
        run: cargo fmt --all --check

      # Builds and lints every workspace member.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Check the standalone fuzz crate builds
        # fuzz/ is not a workspace member, so the clippy/test steps above never
        # touch it; this catches a fuzz target that stops compiling (e.g. a stale
        # dep) before it silently rots the nightly fuzz run. See #326.
        run: cd fuzz && cargo check --tests

  # Keeps the front end and wasm backend buildable for wasm32 so the compiler
  # can run in a browser or embedded host.
  wasm32:
    runs-on: goat-runners
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The image installs Rust under ~/.cargo/bin but does not add it to the
      # job shell's PATH the way GitHub-hosted runners do, so rustup/cargo/sccache
      # are not found until this runs. Must precede Start sccache (sccache lives
      # there too).
      - name: Enable rust
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start sccache
        run: bash .github/scripts/start-sccache.sh

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build for wasm32
        run: >
          cargo build -p goat_parser -p goat_checker -p goat_mir -p goat_wasm
          -p goat -p goat_web --target wasm32-unknown-unknown

      - name: Build and record the compiler artifact
        run: |
          cargo build -p goat_web --target wasm32-unknown-unknown --release
          ls -l target/wasm32-unknown-unknown/release/goat_web.wasm

  # Type-checks and builds the TypeScript web runtime, then runs it against
  # modules compiled by goat_web itself. The runner image's Node 24 executes .ts tests natively.
  web-runtime:
    runs-on: goat-runners
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The image installs Rust under ~/.cargo/bin but does not add it to the
      # job shell's PATH the way GitHub-hosted runners do, so rustup/cargo/sccache
      # are not found until this runs. Must precede Start sccache (sccache lives
      # there too).
      - name: Enable rust
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start sccache
        run: bash .github/scripts/start-sccache.sh

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build the compiler as wasm
        run: cargo build -p goat_web --target wasm32-unknown-unknown --release

      - name: Install web dev dependencies
        run: npm ci --prefix web

      - name: Build the browser runtime (tsc)
        run: npm run build --prefix web

      - name: Type-check the tests
        run: npm run typecheck --prefix web

      - name: Test the browser runtime
        run: node --test web/*.test.ts
