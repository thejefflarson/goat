name: CI

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:

# Cancel superseded runs for the same ref so a fast push doesn't pile up jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: goat-runners
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The image installs Rust under ~/.cargo/bin but does not add it to the
      # job shell's PATH the way GitHub-hosted runners do, so rustup/cargo/sccache
      # are not found until this runs. Must precede Start sccache (sccache lives
      # there too).
      - name: Enable rust
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start sccache
        run: bash .github/scripts/start-sccache.sh

      # The runner ships a stable Rust toolchain; just add the components we
      # lint with.
      - name: Add clippy and rustfmt
        run: rustup component add clippy rustfmt

      - name: Editor image build context covers the workspace
        run: bash .github/scripts/check-dockerignore.sh

      - name: Format
        run: cargo fmt --all --check

      # Builds and lints every workspace member.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The runner image bakes a pinned cargo-nextest (see the goat-runners
      # Dockerfile); fail loudly rather than silently falling back to serial
      # `cargo test`.
      - name: Runner cores and nextest version
        run: |
          echo "cores: $(nproc)"
          cargo nextest --version

      # nextest runs test binaries in parallel; it skips doctests, so those
      # run separately. Profile `ci` (.config/nextest.toml) lets one failure
      # not hide the others.
      - name: Test
        run: cargo nextest run --profile ci

      - name: Doctests
        run: cargo test --doc

      - name: Check the standalone fuzz crate builds
        # fuzz/ is not a workspace member, so the clippy/test steps above never
        # touch it; this catches a fuzz target that stops compiling (e.g. a stale
        # dep) before it silently rots the nightly fuzz run. See #326.
        run: cd fuzz && cargo check --tests

  # Keeps the front end and wasm backend buildable for wasm32 so the compiler
  # can run in a browser or embedded host.
  wasm32:
    runs-on: goat-runners
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The image installs Rust under ~/.cargo/bin but does not add it to the
      # job shell's PATH the way GitHub-hosted runners do, so rustup/cargo/sccache
      # are not found until this runs. Must precede Start sccache (sccache lives
      # there too).
      - name: Enable rust
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start sccache
        run: bash .github/scripts/start-sccache.sh

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build for wasm32
        run: >
          cargo build -p goat_parser -p goat_checker -p goat_mir -p goat_wasm
          -p goat -p goat_web --target wasm32-unknown-unknown

      - name: Build and record the compiler artifact
        run: |
          cargo build -p goat_web --target wasm32-unknown-unknown --release
          ls -l target/wasm32-unknown-unknown/release/goat_web.wasm

  # Cross-builds the vendored WAMR for the board architectures with the feature
  # floor on (docs/adr/0029). Needs no board: the build must link, and a build
  # with tail calls or bulk memory off must fail.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The .debs are cached per runner image so a warm run installs offline
      # and survives an apt mirror outage; a cold run retries the downloads.
      - name: Read runner image version
        id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache cross toolchain packages
        id: debs
        uses: actions/cache@v6
        with:
          path: ~/toolchain-debs
          key: firmware-debs-${{ runner.os }}-${{ steps.image.outputs.version }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Download cross toolchain packages
        if: steps.debs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          mkdir -p ~/toolchain-debs
          sudo apt-get -o Acquire::Retries=5 -o Dir::Cache::archives="$HOME/toolchain-debs" \
            install -y --download-only \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          sudo chown -R "$USER" ~/toolchain-debs
          rm -f ~/toolchain-debs/lock
          rm -rf ~/toolchain-debs/partial

      - name: Install cross toolchains
        run: sudo dpkg -i ~/toolchain-debs/*.deb

      - name: Cross-build WAMR for riscv32imc and thumbv6m
        run: firmware/check.sh

  # Type-checks and builds the TypeScript web runtime, then runs it against
  # modules compiled by goat_web itself. The runner image's Node 24 executes .ts tests natively.
  web-runtime:
    runs-on: goat-runners
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The image installs Rust under ~/.cargo/bin but does not add it to the
      # job shell's PATH the way GitHub-hosted runners do, so rustup/cargo/sccache
      # are not found until this runs. Must precede Start sccache (sccache lives
      # there too).
      - name: Enable rust
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start sccache
        run: bash .github/scripts/start-sccache.sh

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build the compiler as wasm
        run: cargo build -p goat_web --target wasm32-unknown-unknown --release

      - name: Install web dev dependencies
        run: npm ci --prefix web

      - name: Build the browser runtime (tsc)
        run: npm run build --prefix web

      - name: Type-check the tests
        run: npm run typecheck --prefix web

      - name: Test the browser runtime
        run: node --test web/*.test.ts
