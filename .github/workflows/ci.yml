name: CI

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
  # Nightly, so the oldest supported clang (17) is exercised even on quiet days.
  schedule:
    - cron: "30 6 * * *"

# Cancel superseded PR runs so a fast push doesn't pile up jobs; master and tag
# runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The goat-runners pods share two minis with other scale sets, and their
  # memory request is far below their limit, so a node can be overcommitted; a
  # build that peaks high gets the pod killed mid-job ("runner lost
  # communication"). Two rustc jobs and line tables only (not full debuginfo,
  # whose linking dominates peak memory) keep the peak well under the limit.
  CARGO_BUILD_JOBS: "2"
  # sccache refuses incremental compiles, so workspace crates would never hit.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

jobs:
  # Decides which jobs below run. A skipped job satisfies a required check, so
  # the required names still report. When the base cannot be resolved (new
  # branch, tag, shallow history) everything runs.
  changes:
    runs-on: goat-runners
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      fuzz: ${{ steps.paths.outputs.fuzz }}
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          rust='^(Cargo\.(toml|lock)$|rust-toolchain|\.cargo/|\.config/|parser/|checker/|mir/|wasm/|llvm/|wamr/|goat/|cli/|canvas/|web/|fuzz/|differential/|firmware/|prelude/|editor/|examples/|grammar/|docs/llm\.md$|proofs/(goat_ln\.ott|GoatShape\.v|GoatPrinterTable\.v)$|\.github/workflows/ci\.yml$|\.github/scripts/)'
          fuzz='^(Cargo\.(toml|lock)$|rust-toolchain|\.cargo/|\.config/|parser/|checker/|mir/|wamr/|goat/|cli/|fuzz/|prelude/|grammar/|examples/|\.github/workflows/ci\.yml$)'
          native='^(llvm/|native/|mir/|cli/src/native_build\.rs$|\.github/workflows/ci\.yml$)'
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base; running everything."
            printf 'rust=true\nfuzz=true\nnative=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          matches() { printf '%s\n' "$files" | grep -Eq "$1" && echo true || echo false; }
          echo "rust=$(matches "$rust")" >> "$GITHUB_OUTPUT"
          echo "fuzz=$(matches "$fuzz")" >> "$GITHUB_OUTPUT"
          echo "native=$(matches "$native")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  check:
    runs-on: goat-runners
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    env:
      RUSTC_WRAPPER: sccache
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The image installs Rust under ~/.cargo/bin but does not add it to the
      # job shell's PATH the way GitHub-hosted runners do, so rustup/cargo/sccache
      # are not found until this runs. Must precede Start sccache (sccache lives
      # there too).
      - name: Enable rust
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start sccache
        run: bash .github/scripts/start-sccache.sh

      # The runner ships a stable Rust toolchain; just add the components we
      # lint with.
      - name: Add clippy and rustfmt
        run: rustup component add clippy rustfmt

      - name: Editor image build context covers the workspace
        run: bash .github/scripts/check-dockerignore.sh

      - name: Format
        run: cargo fmt --all --check

      # Builds and lints every workspace member.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The runner image bakes a pinned cargo-nextest (see the goat-runners
      # Dockerfile); fail loudly rather than silently falling back to serial
      # `cargo test`.
      - name: Runner cores and nextest version
        run: |
          echo "cores: $(nproc)"
          cargo nextest --version

      # nextest runs test binaries in parallel; it skips doctests, so those
      # run separately. Profile `ci` (.config/nextest.toml) lets one failure
      # not hide the others.
      - name: Test
        run: cargo nextest run --profile ci --test-threads 2

      - name: Doctests
        run: cargo test --doc

      - name: Check the standalone fuzz crate builds
        if: needs.changes.outputs.fuzz == 'true'
        # fuzz/ is not a workspace member, so the clippy/test steps above never
        # touch it; this catches a fuzz target that stops compiling (e.g. a stale
        # dep) before it silently rots the nightly fuzz run. See #326.
        run: cd fuzz && CARGO_BUILD_JOBS=1 cargo check --tests

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  # The native backend (ADR 0042) against the clang floor and a current clang.
  # The runner image ships both as versioned names; bare `clang` is a different
  # version. The workspace run under GOAT_RUNTIME=native covers the llvm/ and
  # native/ tests and the `goat build --native` CLI tests along with the
  # conformance suites. CLANG feeds the in-process driver, GOAT_CLANG the CLI.
  native:
    runs-on: goat-runners
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Every PR runs the latest clang; the floor (17) runs on master and nightly.
        clang: ${{ fromJSON(github.event_name == 'pull_request' && '["clang-23"]' || '["clang-17", "clang-23"]') }}
    env:
      RUSTC_WRAPPER: sccache
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GOAT_RUNTIME: native
      CLANG: ${{ matrix.clang }}
      GOAT_CLANG: ${{ matrix.clang }}
    steps:
      - uses: actions/checkout@v7

      - name: Enable rust
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start sccache
        run: bash .github/scripts/start-sccache.sh

      - name: Runner image has clang 17 and 23
        run: |
          clang-17 --version && clang-23 --version || {
            echo "::error::clang-17 or clang-23 is missing: this pod runs an image older than ghcr.io/thejefflarson/runner:main (see thejefflarson/runner#64). Restart the runner pod to pull the current image."
            exit 1
          }

      - name: Build the standalone runtime library
        run: cargo build -p goat_native

      - name: Test with the native backend
        run: cargo nextest run --profile ci --test-threads 2

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  # Apple's clang and linker differ from the Linux ones (dylibs, -liconv,
  # -dead_strip), so the native suites run there too. GitHub-hosted macOS is the
  # one hosted runner the project allows: there is no self-hosted macOS runner.
  native-macos:
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.native == 'true'
    timeout-minutes: 45
    env:
      GOAT_RUNTIME: native
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Apple clang
        run: clang --version

      - name: Build the standalone runtime library
        run: cargo build -p goat_native

      - name: Test the llvm and native crates
        run: cargo test -p goat_llvm -p goat_native -- --test-threads 2

      - name: Test goat build --native
        run: cargo test -p goat_cli --test native_build -- --test-threads 2

      # The AppKit host links with swiftc; --headless runs the linked binary
      # without a window, so the runner needs no display.
      - name: Build and run an interactive example
        run: |
          cargo build -p goat_cli
          target/debug/goat build --native --canvas examples/canvas/bounce.goat -o "$RUNNER_TEMP/bounce"
          "$RUNNER_TEMP/bounce" --headless 10

  # Keeps the front end and wasm backend buildable for wasm32 so the compiler
  # can run in a browser or embedded host.
  wasm32:
    runs-on: goat-runners
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    env:
      RUSTC_WRAPPER: sccache
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The image installs Rust under ~/.cargo/bin but does not add it to the
      # job shell's PATH the way GitHub-hosted runners do, so rustup/cargo/sccache
      # are not found until this runs. Must precede Start sccache (sccache lives
      # there too).
      - name: Enable rust
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start sccache
        run: bash .github/scripts/start-sccache.sh

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build for wasm32
        run: >
          cargo build -p goat_parser -p goat_checker -p goat_mir -p goat_wasm -p goat_llvm
          -p goat -p goat_web --target wasm32-unknown-unknown

      - name: Build and record the compiler artifact
        run: |
          cargo build -p goat_web --target wasm32-unknown-unknown --release
          ls -l target/wasm32-unknown-unknown/release/goat_web.wasm

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  # Cross-builds the vendored WAMR for the board architectures with the feature
  # floor on (docs/adr/0029). Needs no board: the build must link, and a build
  # with tail calls or bulk memory off must fail.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The .debs are cached per runner image so a warm run installs offline
      # and survives an apt mirror outage; a cold run retries the downloads.
      - name: Read runner image version
        id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache cross toolchain packages
        id: debs
        uses: actions/cache@v6
        with:
          path: ~/toolchain-debs
          key: firmware-debs-${{ runner.os }}-${{ steps.image.outputs.version }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Download cross toolchain packages
        if: steps.debs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          mkdir -p ~/toolchain-debs
          sudo apt-get -o Acquire::Retries=5 -o Dir::Cache::archives="$HOME/toolchain-debs" \
            install -y --download-only \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          sudo chown -R "$USER" ~/toolchain-debs
          rm -f ~/toolchain-debs/lock
          rm -rf ~/toolchain-debs/partial

      - name: Install cross toolchains
        run: sudo dpkg -i ~/toolchain-debs/*.deb

      - name: Cross-build WAMR for riscv32imc and thumbv6m
        run: firmware/check.sh

  # Type-checks and builds the TypeScript web runtime, then runs it against
  # modules compiled by goat_web itself. The runner image's Node 24 executes .ts tests natively.
  web-runtime:
    runs-on: goat-runners
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    env:
      RUSTC_WRAPPER: sccache
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The image installs Rust under ~/.cargo/bin but does not add it to the
      # job shell's PATH the way GitHub-hosted runners do, so rustup/cargo/sccache
      # are not found until this runs. Must precede Start sccache (sccache lives
      # there too).
      - name: Enable rust
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start sccache
        run: bash .github/scripts/start-sccache.sh

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build the compiler as wasm
        run: cargo build -p goat_web --target wasm32-unknown-unknown --release

      - name: Install web dev dependencies
        run: npm ci --prefix web

      - name: Build the browser runtime (tsc)
        run: npm run build --prefix web

      - name: Type-check the tests
        run: npm run typecheck --prefix web

      - name: Test the browser runtime
        run: node --test web/*.test.ts

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
