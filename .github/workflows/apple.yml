name: apple

# Builds the SwiftUI editor (hosts/apple) for macOS and iOS. Unsigned: no
# signing identity is needed to prove the targets compile and bundle.
on:
  pull_request:
    paths: ["hosts/apple/**", "web/**", ".github/workflows/apple.yml"]
  push:
    branches: [master]
    paths: ["hosts/apple/**", "web/**", ".github/workflows/apple.yml"]

permissions:
  contents: read

jobs:
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Stage the drawing engine
        run: hosts/apple/scripts/stage-web.sh

      - name: Test GoatKit
        run: swift test --package-path hosts/apple/GoatKit

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec hosts/apple/project.yml

      - name: Check document type declarations
        run: hosts/apple/scripts/check-doc-types.sh

      # Ad-hoc signed, not unsigned: the sandbox entitlements only take effect on a
      # signed host, and the sandbox is what this test exists to exercise.
      - name: Test the engine in a sandboxed web view
        run: >
          xcodebuild test -project hosts/apple/Goat.xcodeproj -scheme GoatKitTests-macOS
          -destination 'platform=macOS' CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES
          ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Build macOS
        run: >
          xcodebuild -project hosts/apple/Goat.xcodeproj -scheme Goat-macOS
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build

      # Boots the app straight into the editor (-goat-ui-smoke), taps Run, and waits
      # for the canvas to report the program finished. Picks whichever iPhone
      # simulator the runner's Xcode ships.
      - name: UI smoke test on the iOS simulator
        run: |
          udid=$(xcrun simctl list devices available iPhone | grep -Eo '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' | head -1)
          xcodebuild test -project hosts/apple/Goat.xcodeproj -scheme Goat-iOS \
            -destination "platform=iOS Simulator,id=$udid" \
            CODE_SIGNING_ALLOWED=NO ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Build iOS
        run: >
          xcodebuild -project hosts/apple/Goat.xcodeproj -scheme Goat-iOS
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
