name: Nightly fuzz

# Coverage-guided bolero fuzzing. Nightly and manual only: the per-PR gates run
# a bounded randomized pass under `cargo test`, and this searches much deeper.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Fuzz time per target (bolero -T syntax, e.g. 20m)"
        default: ""

env:
  CARGO_TERM_COLOR: always
  FUZZ_BUDGET: ${{ inputs.budget || '20m' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: [differential_interp_vs_wasm, check_never_panics, compile_never_panics, parse_recovery_holds_its_invariants, differential_checker_vs_w]
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-bolero
        run: cargo install cargo-bolero --locked --version 0.13.5

      # Carry the coverage corpus across runs so each night deepens the last
      # instead of starting cold. The run-id-suffixed key never hits exactly, so
      # the save step below always stores the grown corpus; restore-keys pulls the
      # most recent prior one. The corpus is gitignored, so this cache is its only
      # home between runs.
      - name: Restore the ${{ matrix.target }} corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/tests/__fuzz__/${{ matrix.target }}/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # differential_checker_vs_w runs the extracted, proven inference algorithm
      # as a child process. The Coq workflow uploads its OCaml sources on every
      # push to master that could change them (coq.yml); this builds the driver
      # from the latest one, since this runner cannot build the Rocq switch.
      - name: Fetch the extracted algorithm
        if: matrix.target == 'differential_checker_vs_w'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=goat-w-extracted&per_page=10" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          if [ -z "$run_id" ]; then
            echo "::error::no unexpired goat-w-extracted artifact. GitHub keeps artifacts 90 days, so a repository with no push to master touching proofs/, differential/, checker/, prelude/, parser/, examples/ or the grammar for 90 days has none. Run the Coq workflow on master (Actions, Coq, Run workflow) to build a new one."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name goat-w-extracted --dir w-extracted

      - name: Build the differential driver
        if: matrix.target == 'differential_checker_vs_w'
        working-directory: w-extracted
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocaml-nox ocaml-findlib
          ocamlfind ocamlopt -w -a -package unix -linkpkg goat_infer.mli goat_infer.ml driver.ml -o driver
          echo "GOAT_W_DRIVER=$PWD/driver" >> "$GITHUB_ENV"

      - name: Fuzz
        working-directory: fuzz
        run: cargo +nightly bolero test ${{ matrix.target }} --engine libfuzzer -T "$FUZZ_BUDGET"

      # if: always() — save even when the run crashed, so the inputs that found
      # the crash and the coverage reached getting there seed the next run.
      - name: Persist the grown ${{ matrix.target }} corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz/tests/__fuzz__/${{ matrix.target }}/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # bolero writes crashing inputs under tests/__fuzz__/<target>/crashes.
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crashes-${{ matrix.target }}
          path: fuzz/tests/__fuzz__/
          if-no-files-found: ignore

      # A crash of differential_checker_vs_w replays with the driver built from
      # these sources, so a developer needs no Rocq switch to reproduce it.
      - name: Upload the extracted algorithm beside the crash
        if: failure() && matrix.target == 'differential_checker_vs_w'
        uses: actions/upload-artifact@v7
        with:
          name: crashes-differential_checker_vs_w-driver-sources
          path: w-extracted/*.ml*
          if-no-files-found: ignore

  # A red nightly run is easy to miss in email, so a crash opens a tracking issue
  # pointing at the run and its crash artifacts. Deduped on the `nightly-fuzz`
  # label: a still-failing nightly comments on the open issue instead of filing
  # a fresh one each night.
  report:
    needs: fuzz
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or bump the fuzz-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create nightly-fuzz --color FBCA04 \
            --description "A nightly fuzz run found a crash" 2>/dev/null || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label nightly-fuzz --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Nightly fuzz failed again — $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label nightly-fuzz \
              --title "Nightly fuzz found a crash" \
              --body "$(printf 'A nightly fuzz run failed — a target found a crash.\n\nRun: %s\n\nThe failing matrix leg and the crashing inputs are on that run (the `crashes-<target>` artifact). Reproduce locally:\n\n    cd fuzz && cargo +nightly bolero test <target> --engine libfuzzer\n\nwhich replays the saved crashes under `fuzz/tests/__fuzz__/<target>/crashes/`.' "$RUN_URL")"
          fi
