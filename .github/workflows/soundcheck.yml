name: Security Review
on:
  # PRs that touch code only — skip docs-only PRs (ADRs, markdown, papers).
  # No push/master run (the PR already reviewed the diff) and no weekly scan.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'papers/**'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  review:
    runs-on: goat-runners
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: thejefflarson/soundcheck-action@ba406c301382211d66118ebcc699267745f7f849  # v2.1.2
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
