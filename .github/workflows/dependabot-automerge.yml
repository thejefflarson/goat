name: Dependabot Auto-merge
on:
  pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  audit:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --prefix web
      # High and above: a low-severity advisory should not stall every bump.
      - run: npm audit --prefix web --audit-level=high

  auto-merge:
    needs: audit
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
      # Only patch bumps merge unattended. Minor/major can carry breaking or
      # malicious changes that still pass CI, so they wait for a human.
      - name: Enable auto-merge for patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
