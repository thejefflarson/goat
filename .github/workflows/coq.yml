name: Coq

# Builds the mechanized soundness development in proofs/ under coqc (ADR 0008,
# issue #70), natively on the self-hosted runner image (Coq, Ott, metalib baked in). Deliberately separate from the Rust `check`/`wasm32` jobs and the
# Kani `verify` job: the Coq toolchain is slow to build and must never gate
# or slow the per-PR Rust critical path.
#
# Trigger: only when proofs/ or this workflow change (so ordinary Rust PRs don't
# pay for a Coq build), plus manual dispatch. It is intended as an informational
# check, not a required one — promote it to required in branch protection once
# the development has stabilized.

on:
  push:
    paths:
      - "proofs/**"
      - ".github/workflows/coq.yml"
  pull_request:
    paths:
      - "proofs/**"
      - ".github/workflows/coq.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coq:
    runs-on: goat-runners
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # The runner image bakes Coq 8.20.1, ott.0.34 and metalib into an opam
      # switch; CONFIRM this name against the runner image.
      OPAM_SWITCH: default
    steps:
      - uses: actions/checkout@v5

      - name: Build proofs under coqc
        run: |
          eval "$(opam env --switch="$OPAM_SWITCH" --set-switch)"
          make -C proofs ci
