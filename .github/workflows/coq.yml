name: Coq

# Builds the mechanized soundness development in proofs/ under Rocq 9.1 (ADR
# 0008, issue #70), natively on the self-hosted runner image, whose baked opam
# switch rocq-9 (Rocq 9.1.1, Ott 0.34, metalib) this job selects explicitly with
# `opam exec --switch=rocq-9`. The image's older coq-8.20.1 switch is also on
# PATH, so the job checks the version instead of trusting PATH: an image without
# the rocq-9 switch fails with the expected versions rather than building on 8.20.
# Deliberately separate from the Rust `check`/`wasm32` jobs and the Kani `verify`
# job: the toolchain is slow to build and must never gate or slow the per-PR Rust
# critical path.
#
# Trigger: only when proofs/, the grammar, the Coq emitter and what it prints
# through (parser/src/peg.rs, parser/src/lexer.rs) or this workflow change (so ordinary Rust PRs don't
# pay for a Coq build), plus manual dispatch. It is intended as an informational
# check, not a required one — promote it to required in branch protection once
# the development has stabilized.

on:
  push:
    branches: [master]
    paths:
      - "proofs/**"
      - "checker/**"
      - "examples/**"
      - "docs/llm.md"
      - "differential/**"
      - "parser/**"
      - "grammar/goat.peg"
      - "parser/examples/emit_coq.rs"
      - "parser/src/peg.rs"
      - "parser/src/lexer.rs"
      - ".github/workflows/coq.yml"
  pull_request:
    paths:
      - "proofs/**"
      - "checker/**"
      - "examples/**"
      - "docs/llm.md"
      - "differential/**"
      - "parser/**"
      - "grammar/goat.peg"
      - "parser/examples/emit_coq.rs"
      - "parser/src/peg.rs"
      - "parser/src/lexer.rs"
      - ".github/workflows/coq.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coq:
    runs-on: goat-runners
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      # check-grammar regenerates proofs/GoatGrammar.v with cargo. The image
      # installs Rust under ~/.cargo/bin without adding it to the job PATH.
      - name: Enable rust
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check the Rocq toolchain
        run: |
          if ! opam switch list --short | grep -qx rocq-9; then
            echo "::error::runner image has no opam switch 'rocq-9'. Expected Rocq 9.1.1 (opam coq.9.1.1), ott.0.34, and coq-metalib at plclub/metalib 144ddcd0fff6717229140314cf559d85fad6eae0. Rebuild the image."
            exit 1
          fi
          v=$(opam exec --switch=rocq-9 -- rocq --version | head -n1)
          echo "$v"
          case "$v" in
            *"version 9.1."*) ;;
            *) echo "::error::expected Rocq 9.1.x in switch rocq-9, got: $v"; exit 1 ;;
          esac

      - name: Build proofs under Rocq
        run: opam exec --switch=rocq-9 -- make -C proofs ci
