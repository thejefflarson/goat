name: Coq

# Builds the mechanized soundness development in proofs/ under coqc (ADR 0008,
# issue #70), natively on the self-hosted runner image, whose baked opam switch
# coq-8.20.1 (Coq, Ott, metalib) is already on PATH and OCAMLPATH. Deliberately separate from the Rust `check`/`wasm32` jobs and the
# Kani `verify` job: the Coq toolchain is slow to build and must never gate
# or slow the per-PR Rust critical path.
#
# Trigger: only when proofs/, the grammar, the Coq emitter and what it prints
# through (parser/src/peg.rs, parser/src/lexer.rs) or this workflow change (so ordinary Rust PRs don't
# pay for a Coq build), plus manual dispatch. It is intended as an informational
# check, not a required one — promote it to required in branch protection once
# the development has stabilized.

on:
  push:
    branches: [master]
    paths:
      - "proofs/**"
      - "checker/**"
      - "examples/**"
      - "docs/llm.md"
      - "differential/**"
      - "parser/**"
      - "grammar/goat.peg"
      - "parser/examples/emit_coq.rs"
      - "parser/src/peg.rs"
      - "parser/src/lexer.rs"
      - ".github/workflows/coq.yml"
  pull_request:
    paths:
      - "proofs/**"
      - "checker/**"
      - "examples/**"
      - "docs/llm.md"
      - "differential/**"
      - "parser/**"
      - "grammar/goat.peg"
      - "parser/examples/emit_coq.rs"
      - "parser/src/peg.rs"
      - "parser/src/lexer.rs"
      - ".github/workflows/coq.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coq:
    runs-on: goat-runners
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      # check-grammar regenerates proofs/GoatGrammar.v with cargo. The image
      # installs Rust under ~/.cargo/bin without adding it to the job PATH.
      - name: Enable rust
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build proofs under coqc
        run: make -C proofs ci
