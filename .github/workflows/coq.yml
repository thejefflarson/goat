name: Coq

# Builds the mechanized soundness development in proofs/ under coqc (ADR 0008,
# issue #70), natively on the self-hosted runner image, whose baked opam switch
# coq-8.20.1 (Coq, Ott, metalib) is already on PATH and OCAMLPATH. Deliberately separate from the Rust `check`/`wasm32` jobs and the
# Kani `verify` job: the Coq toolchain is slow to build and must never gate
# or slow the per-PR Rust critical path.
#
# Trigger: every PR and push to master, so the `coq` check always reports and
# can be required in branch protection (ADR 0037). The job diffs the changed
# files itself and skips the build, still succeeding, when nothing the Coq build
# depends on changed (proofs/, the grammar, the Coq emitter and what it prints
# through, or this workflow). A push without a usable base and manual dispatch
# always build.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coq:
    runs-on: goat-runners
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Coq-relevant changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          relevant='^(proofs/|grammar/goat\.peg$|parser/examples/emit_coq\.rs$|parser/src/peg\.rs$|parser/src/lexer\.rs$|\.github/workflows/coq\.yml$)'
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...$HEAD" | grep -Eq "$relevant"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Coq-relevant changes; skipping the build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      # check-grammar regenerates proofs/GoatGrammar.v with cargo. The image
      # installs Rust under ~/.cargo/bin without adding it to the job PATH.
      - name: Enable rust
        if: steps.changes.outputs.build == 'true'
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build proofs under coqc
        if: steps.changes.outputs.build == 'true'
        run: make -C proofs ci
