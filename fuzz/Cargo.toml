[package]
name = "goat_fuzz"
version = "0.0.1"
authors = ["Automatically generated"]
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
afl = "0.15"

[dependencies.goat_parser]
path = "../parser"

[dependencies.goat_checker]
path = "../checker"

[profile.release]
opt-level = 1
debug = true
overflow-checks = true

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
