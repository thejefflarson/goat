[package]
name = "goat_fuzz"
version = "0.0.1"
publish = false
edition = "2024"

[dev-dependencies]
bolero = "=0.13.4"
goat = { path = "../goat" }
goat_cli = { path = "../cli" }
goat_mir = { path = "../mir" }
goat_native = { path = "../native" }
goat_parser = { path = "../parser" }
goat_wamr = { path = "../wamr" }

[dev-dependencies.goat_checker]
path = "../checker"

# Separate from the main workspace: this tier needs cargo-bolero and nightly.
[workspace]
members = ["."]

[profile.fuzz]
inherits = "dev"
debug-assertions = true

# differential_checker_vs_w runs the checker and its prelude once per program;
# unoptimized, that is a few programs a second.
[profile.fuzz.package.goat_checker]
opt-level = 2

[profile.fuzz.package.goat_parser]
opt-level = 2
