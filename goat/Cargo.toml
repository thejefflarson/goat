[package]
name = "goat"
version = "0.1.0"
authors = ["Jeff Larson <thejefflarson@gmail.com>"]
edition = "2024"

[dependencies]
goat_checker = { path = "../checker" }
goat_llvm = { version = "0.1.0", path = "../llvm" }
goat_mir = { path = "../mir" }
goat_parser = { version = "0.1.0", path = "../parser" }
goat_wasm = { path = "../wasm" }
wasmtime = { version = "50.0.1", optional = true, features = ["cranelift", "pulley", "runtime", "std"], default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[features]
native = ["dep:wasmtime"]

[[example]]
name = "embed"
required-features = ["native"]
test = true

[[example]]
name = "embed_live"
required-features = ["native"]
test = true

[dev-dependencies]
goat_canvas = { path = "../canvas", default-features = false }
goat_native = { path = "../native" }
goat_parser = { path = "../parser" }

[[example]]
name = "record_arith_bench"
required-features = ["native"]
