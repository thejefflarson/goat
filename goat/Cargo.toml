[package]
name = "goat"
version = "0.1.0"
authors = ["Jeff Larson <thejefflarson@gmail.com>"]
edition = "2024"

[dependencies]
goat_checker = { path = "../checker" }
goat_mir = { path = "../mir" }
goat_wasm = { path = "../wasm" }
wasmtime = { version = "50.0.1", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[features]
native = ["dep:wasmtime"]

[[example]]
name = "embed"
required-features = ["native"]
test = true

[[example]]
name = "embed_live"
required-features = ["native"]
test = true
