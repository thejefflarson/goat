<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goat</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --fg: #1c1c1e; --panel: #fff; --line: #c9c9ce;
    --accent: #5b3fd1; --accent-fg: #fff; --error: #b3261e;
    --selection: #c9c9ce;
    --tok-keyword: #5b3fd1; --tok-literal: #0b6e99; --tok-number: #0b6e99;
    --tok-string: #1a7f37; --tok-comment: #6a6a73; --tok-tag: #b35900;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --fg: #ececf0; --panel: #222226; --line: #3d3d44;
      --accent: #9b86ff; --accent-fg: #17171a; --error: #ff8a80;
      --selection: #3d3d5c;
      --tok-keyword: #b4a3ff; --tok-literal: #7dd3fc; --tok-number: #7dd3fc;
      --tok-string: #7ee787; --tok-comment: #9a9aa5; --tok-tag: #ffb870;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, sans-serif;
  }
  main { max-width: 72rem; margin: 0 auto; display: grid; gap: 16px; }
  @media (min-width: 48rem) {
    main { grid-template-columns: 1fr 1fr; }
    header, #problems, #output { grid-column: 1 / -1; }
  }
  h1 { margin: 0; font-size: 1.25rem; }
  pre, canvas {
    width: 100%; margin: 0; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--fg);
  }
  pre { font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 8px; }
  #source { height: 20rem; resize: vertical; overflow: auto; }
  canvas:focus-visible { outline: 2px solid var(--accent); }
  select { font: inherit; padding: 8px; margin-left: 8px; }
  canvas { aspect-ratio: 1; height: auto; display: block; background: #fff; }
  pre { overflow-x: auto; white-space: pre; }
  #problems { color: var(--error); border-color: var(--error); }
  #output { white-space: pre-wrap; overflow-wrap: anywhere; }
  [hidden] { display: none; }
  button {
    font: inherit; padding: 8px 20px; border: 0; border-radius: 6px; margin-top: 8px;
    background: var(--accent); color: var(--accent-fg); cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: progress; }
  label { margin-left: 12px; white-space: nowrap; }
  #status { margin-left: 12px; }
</style>
</head>
<body>
<main>
  <header><h1>goat</h1></header>
  <section>
    <div id="source"></div>
    <button id="run" disabled>Run</button>
    <select id="example" aria-label="example program">
      <option value="arrow_draw">Arrow keys draw (interactive)</option>
      <option value="spiral">Spiral (run once)</option>
    </select>
    <label><input type="checkbox" id="live" checked> Live</label>
    <span id="status" role="status"></span>
  </section>
  <div id="stage"><canvas id="canvas" width="600" height="600" aria-label="drawing" tabindex="0"></canvas></div>
  <pre id="problems" role="alert" hidden></pre>
  <pre id="output" aria-label="printed output" hidden></pre>
</main>
<script type="module">
  import { compileLive, loadCompiler } from "./dist/compile.js";
  import { superviseCanvas } from "./dist/browser.js";
  import { isInteractiveModule } from "./dist/loop.js";
  import { mountEditor } from "./dist/editor.bundle.js";

  const COMPILER_URL = "./goat_web.wasm";

  const $ = (id) => document.getElementById(id);
  const [sourceHost, button, canvas, problems, output, example, live, status] =
    ["source", "run", "canvas", "problems", "output", "example", "live", "status"].map($);
  const RELOAD_DELAY_MS = 400;

  const EXAMPLES = {
    arrow_draw: `# Press Run, click the picture, then use the arrow keys.
init = {x: 300, y: 300, path: [{x: 300, y: 300}]}

step = program(model, dx, dy) do
  next = {x: model.x + dx, y: model.y + dy}
  {...model, x: next.x, y: next.y, path: Link(next, model.path)}
done

update = program(model, event) do
  match event do
    KeyDown(key) then match key do
      Up then step(model, 0, 0 - 10)
      Down then step(model, 0, 10)
      Left then step(model, 0 - 10, 0)
      Right then step(model, 10, 0)
    else model done
  done
done

draw = program(model) do
  [Polyline({points: model.path, color: "purple"})]
done
`,
    spiral: `color("purple");
for side from 1 to 60 do
  forward(side * 3);
  right(89)
done
`,
  };

  function show(el, text) {
    el.textContent = text;
    el.hidden = text === "";
  }

  // goat runs in a worker the page can terminate; without cross-origin isolation
  // there is no safe way to run it, so the page refuses to start.
  let page;
  let compiler;
  try {
    page = superviseCanvas(canvas);
    compiler = await loadCompiler(COMPILER_URL);
    button.disabled = false;
  } catch (e) {
    show(problems, String(e.message ?? e));
  }

  // Without the compiler the editor still edits; it just neither colors nor checks.
  const editor = mountEditor(sourceHost, EXAMPLES.arrow_draw, compiler);
  example.addEventListener("change", () => editor.setText(EXAMPLES[example.value]));

  const RELOAD_SAYS = {
    kept: "Updated: your sketch kept going",
    reset: "Started over: your change reshaped what the sketch remembers",
  };

  // While a sketch runs, an edit recompiles it and swaps it in. A mistake in the
  // edit leaves the last good version running.
  let reloadTimer;
  let edits = 0;
  async function reload() {
    const edit = ++edits;
    const text = editor.text();
    try {
      const compiled = await compileLive(compiler, text);
      if (edit !== edits) return;
      if (!compiled.ok) {
        show(problems, compiled.diagnostics);
        return show(status, "There is a mistake, so the last good version keeps running");
      }
      show(problems, "");
      if (page.supervisor.reload(compiled.module)) show(status, "Updating...");
    } catch (e) {
      show(problems, String(e.message ?? e));
    }
  }
  editor.onChange(() => {
    clearTimeout(reloadTimer);
    if (live.checked) reloadTimer = setTimeout(reload, RELOAD_DELAY_MS);
  });
  live.addEventListener("change", () => {
    clearTimeout(reloadTimer);
    show(status, "");
  });

  button.addEventListener("click", async () => {
    page.supervisor.stop();
    clearTimeout(reloadTimer);
    button.disabled = true;
    show(problems, "");
    show(output, "");
    show(status, "");
    try {
      const compiled = await compileLive(compiler, editor.text());
      if (!compiled.ok) return show(problems, compiled.diagnostics);
      const interactive = isInteractiveModule(await WebAssembly.compile(compiled.module));
      page.supervisor.start(
        { mode: interactive ? "interactive" : "once", module: compiled.module },
        {
          onReady: () => page.stage.focus(),
          onReloaded: (outcome) => show(status, RELOAD_SAYS[outcome]),
          onReloadFailed: (message) => show(status, message),
          onOutput: (lines) => show(output, lines.join("\n")),
          onFailed: (message) => show(problems, message),
        },
      );
    } catch (e) {
      show(problems, String(e.message ?? e));
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
