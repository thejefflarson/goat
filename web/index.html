<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goat</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --fg: #1c1c1e; --panel: #fff; --line: #c9c9ce;
    --accent: #5b3fd1; --accent-fg: #fff; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --fg: #ececf0; --panel: #222226; --line: #3d3d44;
      --accent: #9b86ff; --accent-fg: #17171a; --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, sans-serif;
  }
  main { max-width: 72rem; margin: 0 auto; display: grid; gap: 16px; }
  @media (min-width: 48rem) {
    main { grid-template-columns: 1fr 1fr; }
    header, #problems, #output { grid-column: 1 / -1; }
  }
  h1 { margin: 0; font-size: 1.25rem; }
  textarea, pre, canvas {
    width: 100%; margin: 0; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--fg);
  }
  textarea, pre { font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 8px; }
  textarea { height: 20rem; resize: vertical; tab-size: 2; }
  canvas:focus-visible { outline: 2px solid var(--accent); }
  select { font: inherit; padding: 8px; margin-left: 8px; }
  canvas { aspect-ratio: 1; height: auto; display: block; background: #fff; }
  pre { overflow-x: auto; white-space: pre; }
  #problems { color: var(--error); border-color: var(--error); }
  #output { white-space: pre-wrap; overflow-wrap: anywhere; }
  [hidden] { display: none; }
  button {
    font: inherit; padding: 8px 20px; border: 0; border-radius: 6px; margin-top: 8px;
    background: var(--accent); color: var(--accent-fg); cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: progress; }
</style>
</head>
<body>
<main>
  <header><h1>goat</h1></header>
  <section>
    <textarea id="source" aria-label="goat code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <button id="run" disabled>Run</button>
    <select id="example" aria-label="example program">
      <option value="arrow_draw">Arrow keys draw (interactive)</option>
      <option value="spiral">Spiral (run once)</option>
    </select>
  </section>
  <canvas id="canvas" width="600" height="600" aria-label="drawing" tabindex="0"></canvas>
  <pre id="problems" role="alert" hidden></pre>
  <pre id="output" aria-label="printed output" hidden></pre>
</main>
<script type="module">
  import { compile, loadCompiler } from "./dist/compile.js";
  import { isInteractiveModule, runInteractive } from "./dist/loop.js";
  import { animate, run } from "./dist/runtime.js";

  const COMPILER_URL = "./goat_web.wasm";

  const $ = (id) => document.getElementById(id);
  const [source, button, canvas, problems, output, example] =
    ["source", "run", "canvas", "problems", "output", "example"].map($);

  const EXAMPLES = {
    arrow_draw: `# Press Run, click the picture, then use the arrow keys.
init = {x: 300, y: 300, path: [{x: 300, y: 300}]}

step = program(model, dx, dy) do
  next = {x: model.x + dx, y: model.y + dy}
  {...model, x: next.x, y: next.y, path: Link(next, model.path)}
done

update = program(model, event) do
  match event do
    KeyDown(key) then match key do
      Up then step(model, 0, 0 - 10)
      Down then step(model, 0, 10)
      Left then step(model, 0 - 10, 0)
      Right then step(model, 10, 0)
    else model done
  done
done

draw = program(model) do
  [Polyline({points: model.path, color: "purple"})]
done
`,
    spiral: `color("purple");
for side from 1 to 60 do
  forward(side * 3);
  right(89)
done
`,
  };
  source.value = EXAMPLES.arrow_draw;
  example.addEventListener("change", () => (source.value = EXAMPLES[example.value]));

  let loop;

  function show(el, text) {
    el.textContent = text;
    el.hidden = text === "";
  }

  let compiler;
  try {
    compiler = await loadCompiler(COMPILER_URL);
    button.disabled = false;
  } catch (e) {
    show(problems, String(e.message ?? e));
  }

  button.addEventListener("click", async () => {
    loop?.stop();
    button.disabled = true;
    show(problems, "");
    show(output, "");
    canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
    try {
      const compiled = await compile(compiler, source.value);
      if (!compiled.ok) return show(problems, compiled.diagnostics);
      if (isInteractiveModule(await WebAssembly.compile(compiled.module))) {
        loop = await runInteractive(compiled.module, canvas, (message) => show(problems, message));
        canvas.focus();
        return;
      }
      const lines = [];
      const { commands } = await run(compiled.module, { onOutput: (line) => lines.push(line) });
      show(output, lines.join("\n"));
      await animate(canvas, commands);
    } catch (e) {
      show(problems, String(e.message ?? e));
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
