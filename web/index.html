<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goat</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --fg: #1c1c1e; --panel: #fff; --line: #c9c9ce;
    --accent: #5b3fd1; --accent-fg: #fff; --error: #b3261e;
    --selection: #c9c9ce;
    --tok-keyword: #4a2fb8; --tok-literal: #095a80; --tok-number: #095a80;
    --tok-string: #14602b; --tok-comment: #505058; --tok-tag: #80400a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --fg: #ececf0; --panel: #222226; --line: #3d3d44;
      --accent: #9b86ff; --accent-fg: #17171a; --error: #ff8a80;
      --selection: #3d3d5c;
      --tok-keyword: #b4a3ff; --tok-literal: #7dd3fc; --tok-number: #7dd3fc;
      --tok-string: #7ee787; --tok-comment: #b8b8c4; --tok-tag: #ffb870;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, sans-serif;
  }
  main { max-width: 72rem; margin: 0 auto; display: grid; gap: 16px; }
  @media (min-width: 48rem) {
    main { grid-template-columns: 1fr 1fr; }
    header, #problems, #output { grid-column: 1 / -1; }
  }
  h1 { margin: 0; font-size: 1.25rem; }
  pre, canvas {
    width: 100%; margin: 0; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--fg);
  }
  pre { font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 8px; }
  #source { height: 20rem; resize: vertical; overflow: auto; }
  canvas:focus-visible { outline: 2px solid var(--accent); }
  select { font: inherit; padding: 8px; margin-left: 8px; }
  canvas { aspect-ratio: 1; height: auto; display: block; background: #fff; }
  pre { overflow-x: auto; white-space: pre; }
  #problems { color: var(--error); border-color: var(--error); }
  #output { white-space: pre-wrap; overflow-wrap: anywhere; }
  [hidden] { display: none; }
  button {
    font: inherit; padding: 8px 20px; border: 0; border-radius: 6px; margin-top: 8px;
    background: var(--accent); color: var(--accent-fg); cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: progress; }
  label { margin-left: 12px; white-space: nowrap; }
  #status { margin-left: 12px; }
</style>
</head>
<body>
<main>
  <header><h1>goat</h1></header>
  <section>
    <div id="source"></div>
    <button id="run" disabled>Run</button>
    <select id="example" aria-label="example program">
      <option value="arrow_draw">Arrow keys draw (interactive)</option>
      <option value="spiral">Spiral (run once)</option>
      <option value="bounce">Bouncing ball (canvas)</option>
      <option value="catch">Catch the coin (canvas)</option>
      <option value="sky">Sky with methods (canvas)</option>
      <option value="ordering">How values compare (prints)</option>
    </select>
    <label><input type="checkbox" id="live" checked> Live</label>
    <span id="status" role="status"></span>
    <button id="theme" type="button" disabled>Edit editor theme</button>
    <button id="reset-theme" type="button" hidden>Reset theme</button>
  </section>
  <div id="stage"><canvas id="canvas" width="600" height="600" aria-label="drawing" tabindex="0"></canvas></div>
  <pre id="problems" role="status" hidden></pre>
  <pre id="output" aria-label="printed output" hidden></pre>
</main>
<script type="module">
  import { compileLive, loadCompiler } from "./dist/compile.js";
  import { canSupervise, superviseCanvas, superviseHighlighter } from "./dist/browser.js";
  import { GoatHighlighter } from "./dist/highlighter.js";
  import { isInteractiveModule } from "./dist/loop.js";
  import { reloadSays } from "./dist/reload-says.js";
  import { ThemeEngine, themeApplier, themeStore } from "./dist/theme.js";
  import { mountEditor } from "./dist/editor.bundle.js";

  const COMPILER_URL = "./goat_web.wasm";

  const $ = (id) => document.getElementById(id);
  const [sourceHost, button, canvas, problems, output, example, live, status, themeButton, resetTheme] =
    ["source", "run", "canvas", "problems", "output", "example", "live", "status", "theme", "reset-theme"].map($);
  const RELOAD_DELAY_MS = 400;

  // An example names its vocabulary: the turtle's, or the canvas host's.
  const HOSTS = { arrow_draw: "turtle", spiral: "turtle", bounce: "canvas", catch: "canvas", sky: "canvas", ordering: "turtle" };
  let host = "turtle";

  const EXAMPLES = {
    arrow_draw: `# Press Run, click the picture, then use the arrow keys.
init = {x: 300, y: 300, path: [{x: 300, y: 300}]}

step = program(model, dx, dy) do
  next = {x: model.x + dx, y: model.y + dy}
  {...model, x: next.x, y: next.y, path: Link(next, model.path)}
done

update = program(model, event) do
  match event do
    KeyDown(key) then match key do
      Up then step(model, 0, 0 - 10)
      Down then step(model, 0, 10)
      Left then step(model, 0 - 10, 0)
      Right then step(model, 10, 0)
    else model done
  done
done

draw = program(model) do
  [Polyline({points: model.path, color: "purple"})]
done
`,
    spiral: `color("purple");
for side from 1 to 60 do
  forward(side * 3);
  right(89)
done
`,
    bounce: `# A ball bouncing in the canvas. The canvas host sends a Frame(dt) event with
# the milliseconds since the last one; draw returns Dot, Segment and Box
# shapes, and the host paints them. The canvas is 400 wide and 300 tall, and y
# grows downward.
init = {x: 40, y: 30, vx: 140, vy: 0}

gravity = 600
floor_y = 270
left_wall = 20
right_wall = 380

bounce = program(m, dt) do
  s = dt / 1000
  vy = m.vy + gravity * s
  x = m.x + m.vx * s
  y = m.y + vy * s
  hit_floor = y > floor_y
  hit_wall = x < left_wall or x > right_wall
  {
    x: x,
    y: if hit_floor then floor_y else y done,
    vx: if hit_wall then 0 - m.vx else m.vx done,
    vy: if hit_floor then 0 - vy * 0.8 else vy done
  }
done

update = program(model, event) do
  match event do
    Frame(dt) then bounce(model, dt)
    else model
  done
done

draw = program(model) do
  [
    Box({x: 0, y: 290, w: 400, h: 10, fill: "green"}),
    Segment({x1: model.x, y1: model.y, x2: model.x, y2: 290, fill: "gray"}),
    Dot({x: model.x, y: model.y, r: 20, fill: "tomato"})
  ]
done
`,
    catch: `# A catching game. Move the basket with the arrow keys or the mouse; each
# gold coin that lands in it scores a point, shown as a growing bar. Five
# points win. The coin falls on every Frame event.
init = {basket: 200, coin_x: 100, coin_y: 0, score: 0}

reach = 40
ground = 270

with_basket = program(model, to) do {basket: to, coin_x: model.coin_x, coin_y: model.coin_y, score: model.score} done

caught = program(model) do
  model.coin_x > model.basket - reach and model.coin_x < model.basket + reach
done

next_column = program(x) do if x > 300 then x - 250 else x + 70 done done

land = program(model) do
  {
    basket: model.basket,
    coin_x: next_column(model.coin_x),
    coin_y: 0,
    score: if caught(model) then model.score + 1 else model.score done
  }
done

fall = program(model, dt) do
  y = model.coin_y + 160 * dt / 1000
  if y < ground then {basket: model.basket, coin_x: model.coin_x, coin_y: y, score: model.score} else land(model) done
done

update = program(model, event) do
  match event do
    Frame(dt) then fall(model, dt)
    MouseMove(p) then with_basket(model, p.x)
    KeyPress(key) then match key do
      Left then with_basket(model, model.basket - 20)
      Right then with_basket(model, model.basket + 20)
      else model
    done
    else model
  done
done

draw = program(model) do
  [
    Box({x: model.basket - reach, y: ground, w: 2 * reach, h: 20, fill: "navy"}),
    Dot({x: model.coin_x, y: model.coin_y, r: 10, fill: "gold"}),
    Box({x: 10, y: 10, w: 20 * model.score, h: 10, fill: "green"}),
    Label({x: 10, y: 30, text: if model.score >= 5 then "you win!" else "catch the gold" done, fill: "black"})
  ]
done
`,
    sky: `# Things in the sky share their fields (x, y, size, fill) but each has its own
# look(self, t) method, so the same call draws each one differently. The
# model holds only the clock t, in milliseconds. The canvas is 400 wide and
# 300 tall.
init = {t: 0}

sun = {
  x: 90, y: 90, size: 30, fill: "gold",
  look: program(self, t) do
    Dot({x: self.x, y: self.y, r: self.size + 4 * sin(t / 10), fill: self.fill})
  done
}

moon = {
  x: 300, y: 70, size: 22, fill: "white",
  look: program(self, t) do
    Dot({x: self.x - 20 * sin(t / 30), y: self.y, r: self.size, fill: self.fill})
  done
}

star = {
  x: 200, y: 40, size: 3, fill: "white",
  look: program(self, t) do
    Dot({x: self.x, y: self.y, r: if sin(t / 5) > 0 then self.size else 1 done, fill: self.fill})
  done
}

# A prototype copy keeps the type and the method.
sky = [sun, moon, star, {...star, x: 140, y: 120}, {...star, x: 250, y: 150}]

update = program(model, event) do
  match event do
    Frame(dt) then {...model, t: model.t + dt}
    else model
  done
done

draw = program(model) do
  join(
    [Box({x: 0, y: 0, w: 400, h: 300, fill: "navy"})],
    change_each(sky, program(item) do item.look(model.t) done)
  )
done
`,
    ordering: `# How goat compares two values with < <= > >=. Each line prints its answer;
# the comment says what it should be. See docs/adr/0036-structural-ordering.md.

tag Level = Low | Medium | High
tag Shot = Miss | Hit(Int)

# Numbers compare by value. An Int and a Float compare together.
print(3 < 5);            # true
print(2 < 1.5);          # false
print(2 <= 2.0);         # true

# Strings compare in dictionary order, by Unicode code point. A shorter
# prefix is smaller.
print("app" < "apple");    # true: a shorter prefix is smaller
print("apple" < "apply");  # true: "e" comes before "y"
print("Zed" < "amy");      # true: capital letters come before lowercase

# Bools: false is smaller than true.
print(false < true);     # true

# Tags go in the order they are declared: the leftmost is the lowest.
print(Low < Medium);     # true
print(High < Medium);    # false
# When two tags match, the payload breaks the tie.
print(Miss < Hit(0));       # true: Miss is declared first
print(Hit(1) < Hit(2));     # true: same tag, so the payload decides

# Lists compare element by element from the left. The first difference
# decides. A list that runs out first is smaller.
print([1, 2] < [1, 3]);     # true: 2 < 3 at the second element
print([1, 9] < [2]);        # true: 1 < 2 decides, the rest is ignored
print([1, 2] < [1, 2, 0]);  # true: the shorter list runs out first
print([] < [1]);            # true: an empty list is the smallest

# Records compare field by field in alphabetical order of the labels, not the
# order you wrote them: {x, y} and {y, x} are the same type. Here age comes
# before name, so the age decides first.
print({name: "Zed", age: 3} < {name: "Amy", age: 9});   # true: 3 < 9
print({age: 9, name: "Amy"} < {name: "Zed", age: 9});   # true: ages tie, "Amy" < "Zed"
# Written in the other order, it is the same comparison.
print({y: 1, x: 2} < {x: 3, y: 0});                     # true: x is first, 2 < 3
# To rank by another field first, put it first in a list or a tag payload.

# Functions can't be compared. Uncommenting this line is an error:
# print(program(n) do n done < program(n) do n done)
print("done")
`,
  };

  function show(el, text) {
    el.textContent = text;
    el.hidden = text === "";
  }

  // goat runs in a worker the page can terminate; without cross-origin isolation
  // there is no safe way to run it, so the page refuses to start.
  let page;
  let compiler;
  try {
    page = superviseCanvas(canvas);
    compiler = await loadCompiler(COMPILER_URL);
    button.disabled = false;
  } catch (e) {
    show(problems, String(e.message ?? e));
  }

  // Developer toggle: ?highlighter=goat colors the editor with editor/highlight.goat,
  // run in a worker of its own, instead of the built-in tokenizer. Any failure
  // leaves the built-in one coloring.
  let highlighter;
  if (compiler && new URLSearchParams(location.search).get("highlighter") === "goat") {
    try {
      const source = await (await fetch("./highlight.goat")).text();
      highlighter = new GoatHighlighter({ compiler, source, runner: superviseHighlighter(), host: () => host });
      highlighter.start();
    } catch {
      highlighter = undefined;
    }
  }

  // Without the compiler the editor still edits; it just neither colors nor checks.
  const editor = mountEditor(sourceHost, EXAMPLES.arrow_draw, compiler, () => host, highlighter);
  example.addEventListener("change", () => {
    if (editingTheme) setThemeMode(false);
    host = HOSTS[example.value];
    editor.setText(EXAMPLES[example.value]);
  });

  // The editor's colours come from editor/theme.goat. "Edit editor theme" swaps
  // it into the editor; saving (Run, or Live as you type) re-colours the page. A
  // theme with a mistake or an unreadable colour leaves the last one in place.
  let themes;
  let defaultTheme = "";
  let editingTheme = false;
  let mine = "";
  const storage = (() => {
    try {
      return localStorage;
    } catch {
      return undefined;
    }
  })();
  if (compiler && canSupervise()) {
    try {
      defaultTheme = await (await fetch("./theme.goat")).text();
      themes = new ThemeEngine({
        compiler,
        runner: superviseHighlighter(),
        apply: themeApplier(document.documentElement, matchMedia("(prefers-color-scheme: dark)")),
      });
      themeButton.disabled = false;
      const saved = themeStore.load(storage);
      if (saved) themes.change(saved);
    } catch {
      themes = undefined;
    }
  }

  function setThemeMode(on) {
    editingTheme = on;
    host = on ? "theme" : HOSTS[example.value];
    themeButton.textContent = on ? "Back to my program" : "Edit editor theme";
    button.textContent = on ? "Save theme" : "Run";
    resetTheme.hidden = !on;
    show(problems, "");
    show(status, "");
  }

  async function saveTheme() {
    const text = editor.text();
    const outcome = await themes.change(text);
    if (!editingTheme || text !== editor.text()) return;
    if (!outcome.ok) {
      show(problems, outcome.message);
      return show(status, "There is a mistake, so the last theme is still in use");
    }
    themeStore.save(storage, text === defaultTheme ? null : text);
    show(problems, outcome.notes.join("\n"));
    show(status, "Theme saved");
  }

  themeButton.addEventListener("click", () => {
    clearTimeout(reloadTimer);
    if (editingTheme) {
      setThemeMode(false);
      return editor.setText(mine);
    }
    mine = editor.text();
    setThemeMode(true);
    editor.setText(themeStore.load(storage) ?? defaultTheme);
  });
  resetTheme.addEventListener("click", () => {
    themeStore.save(storage, null);
    themes.reset();
    editor.setText(defaultTheme);
    show(problems, "");
    show(status, "Theme reset");
  });

  // While a sketch runs, an edit recompiles it and swaps it in. A mistake in the
  // edit leaves the last good version running.
  let reloadTimer;
  let edits = 0;
  async function reload() {
    const edit = ++edits;
    const text = editor.text();
    try {
      const compiled = await compileLive(compiler, text, host);
      if (edit !== edits) return;
      if (!compiled.ok) {
        show(problems, compiled.diagnostics);
        return show(status, "There is a mistake, so the last good version keeps running");
      }
      show(problems, "");
      if (page.supervisor.reload(compiled.module)) show(status, "Updating...");
    } catch (e) {
      show(problems, String(e.message ?? e));
    }
  }
  editor.onChange(() => {
    clearTimeout(reloadTimer);
    if (live.checked) reloadTimer = setTimeout(editingTheme ? saveTheme : reload, RELOAD_DELAY_MS);
  });
  live.addEventListener("change", () => {
    clearTimeout(reloadTimer);
    show(status, "");
  });

  button.addEventListener("click", async () => {
    if (editingTheme) {
      clearTimeout(reloadTimer);
      return saveTheme();
    }
    page.supervisor.stop();
    clearTimeout(reloadTimer);
    button.disabled = true;
    show(problems, "");
    show(output, "");
    show(status, "");
    try {
      const compiled = await compileLive(compiler, editor.text(), host);
      if (!compiled.ok) return show(problems, compiled.diagnostics);
      const interactive = isInteractiveModule(await WebAssembly.compile(compiled.module));
      page.supervisor.start(
        { mode: interactive ? "interactive" : "once", module: compiled.module },
        {
          onReady: () => page.stage.focus(),
          onReloaded: (outcome) => show(status, reloadSays(outcome)),
          onReloadFailed: (message) => show(status, message),
          onOutput: (lines) => show(output, lines.join("\n")),
          onFailed: (message) => show(problems, message),
        },
      );
    } catch (e) {
      show(problems, String(e.message ?? e));
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
