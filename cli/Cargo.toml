[package]
name = "goat_cli"
version = "0.1.0"
authors = ["Jeff Larson <thejefflarson@gmail.com>"]
edition = "2024"

[[bin]]
name = "goat"
path = "src/main.rs"

[dependencies]
goat = { version = "0.1.0", path = "../goat", features = ["native"] }
goat_canvas = { version = "0.1.0", path = "../canvas" }
goat_checker = { version = "0.1.0", path = "../checker" }
goat_detect = { version = "0.1.0", path = "../detect" }
goat_mir = { version = "0.1.0", path = "../mir" }
goat_native = { version = "0.1.0", path = "../native" }
goat_parser = { version = "0.1.0", path = "../parser" }
tempfile = "3.27.0"

[dev-dependencies]
bolero = { version = "=0.13.4", default-features = false, features = ["std"] }
goat_checker = { path = "../checker" }
goat_wamr = { path = "../wamr" }
goat_wasm = { path = "../wasm" }
wasm-encoder = "0.263.0"
wasmtime = "50.0.1"
